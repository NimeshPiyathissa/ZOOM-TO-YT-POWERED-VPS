# Log rotation for the streaming pipeline. Installed by install.sh as /etc/logrotate.d/zoom-stream with
# @LOG_DIR@ and @SVC_USER@ filled in; run by the system's own daily logrotate timer (logrotate.timer on Ubuntu 24.04).
#
# SAFE DURING A LIVE STREAM - this is the whole design:
#   * copytruncate: the log is copied and then emptied IN PLACE. FFmpeg, Zoom and Chrome keep the very same open file
#     and keep writing; nothing is renamed away from under them, so no process has to reopen anything.
#   * There is deliberately NO postrotate/prerotate script, no signal and no service restart. Rotation can never stop,
#     restart or start an encoder (starting one needs an authorized Go Live anyway - scripts/lib.sh broadcast_gate).
#   * Every writer opens these files in append mode (>>), so after the truncate it continues at the new end of file
#     (no sparse "hole"). A few lines written between the copy and the truncate can be lost; that is the accepted
#     cost of not touching a running stream.
#
# Retention: checked daily; a file is rotated once it is over 5 MB, or after a week regardless; 8 old copies are kept
# (gzip, newest one left uncompressed for a day) and nothing older than 60 days. Old copies keep the log's own
# owner-and-group-only permissions (ffmpeg.log history may predate stream-key redaction - scripts/scrub-ffmpeg-log.sh).
@LOG_DIR@/ffmpeg.log @LOG_DIR@/zoom.log @LOG_DIR@/browser.log {
    su @SVC_USER@ @SVC_USER@
    weekly
    maxsize 5M
    rotate 8
    maxage 60
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    nomail
    noolddir
}
